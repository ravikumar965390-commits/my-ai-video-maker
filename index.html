<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI Video Maker</title>

<style>
body {
  margin: 0;
  padding: 20px;
  background: #10121c;
  color: white;
  font-family: Arial, sans-serif;
}
.container {
  max-width: 500px;
  margin: auto;
}
h1 {
  text-align: center;
  color: #8c7cff;
}
.box {
  background: #202438;
  padding: 18px;
  border-radius: 15px;
  margin-top: 20px;
}
input, textarea, button {
  width: 100%;
  box-sizing: border-box;
  padding: 13px;
  margin-top: 12px;
  border-radius: 9px;
  border: none;
}
textarea {
  height: 100px;
}
button {
  background: #7562ff;
  color: white;
  font-size: 17px;
  font-weight: bold;
}
img {
  width: 100%;
  margin-top: 15px;
  border-radius: 12px;
  display: none;
}
</style>
</head>

<body>
<div class="container">

<h1>🎬 My AI Video Maker</h1>
<p style="text-align:center">Create videos from your photos</p>

<div class="box">
<h3>📸 Upload Your Photo</h3>

<input type="file" id="photo" accept="image/*">

<img id="preview">

<h3>✍️ Describe Your Video</h3>

<textarea id="prompt"
placeholder="Describe how you want your photo to move..."></textarea>

<button onclick="generate()">Generate Video 🚀</button>

<p id="message"></p>
</div>

</div>

<script>
document.getElementById("photo").onchange = function(e) {
  const file = e.target.files[0];
  if (!file) return;

  const preview = document.getElementById("preview");
  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
};

function generate() {
  const photo = document.getElementById("photo").files[0];
  const prompt = document.getElementById("prompt").value;

  if (!photo) {
    alert("Please upload a photo!");
    return;
  }

  if (!prompt.trim()) {
    alert("Please write a video prompt!");
    return;
  }

  document.getElementById("message").innerText =
  "Photo uploaded! AI video engine will be connected in the next step.";
}
</script>

</body>
</html>
