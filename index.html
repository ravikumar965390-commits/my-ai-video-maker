
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My AI Video Maker</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  background: #10121c;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 500px;
  margin: auto;
}

h1 {
  text-align: center;
  color: #9585ff;
}

.box {
  background: #202438;
  padding: 20px;
  border-radius: 15px;
  margin-top: 20px;
}

input, textarea, button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: none;
  border-radius: 9px;
}

textarea {
  height: 110px;
  resize: vertical;
}

button {
  background: #7562ff;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  background: #5544d9;
}

#preview {
  display: none;
  width: 100%;
  margin-top: 15px;
  border-radius: 12px;
}

#message {
  color: #a99cff;
  text-align: center;
  line-height: 1.5;
}
</style>
</head>

<body>

<div class="container">

<h1>🎬 My AI Video Maker</h1>
<p style="text-align:center">
Create videos from your photos
</p>

<div class="box">

<h3>📸 Upload Your Photo</h3>

<input type="file" id="photo" accept="image/*">

<img id="preview" alt="Photo preview">

<h3>✍️ Describe Your Video</h3>

<textarea id="prompt"
placeholder="Describe your video..."></textarea>

<button type="button" id="generate">
Generate Video 🚀
</button>

<p id="message">Upload a photo to get started.</p>

</div>
</div>

<script>
const photo = document.getElementById("photo");
const preview = document.getElementById("preview");
const prompt = document.getElementById("prompt");
const message = document.getElementById("message");
const generate = document.getElementById("generate");

photo.addEventListener("change", function() {
  const file = photo.files[0];

  if (!file) return;

  if (!file.type.startsWith("image/")) {
    message.textContent = "Please select an image.";
    return;
  }

  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
  message.textContent = "Photo uploaded successfully!";
});

generate.addEventListener("click", function() {

  if (!photo.files.length) {
    message.textContent = "Please upload a photo first!";
    return;
  }

  if (!prompt.value.trim()) {
    message.textContent = "Please write a video prompt!";
    return;
  }

  message.textContent =
    "Photo and prompt received successfully! AI video engine is not connected yet.";
});
</script>

</body>
</html>
