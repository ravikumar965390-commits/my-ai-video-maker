
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI Video Maker</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #10121c;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 500px;
  margin: auto;
}

h1 {
  text-align: center;
  color: #9585ff;
}

.box {
  background: #202438;
  padding: 20px;
  border-radius: 15px;
  margin-top: 20px;
}

input, textarea, button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: none;
  border-radius: 9px;
}

textarea {
  height: 110px;
  resize: vertical;
}

button {
  background: #7562ff;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

#preview {
  display: none;
  width: 100%;
  margin-top: 15px;
  border-radius: 12px;
}

#message {
  color: #b7aaff;
  text-align: center;
  line-height: 1.5;
}
</style>
</head>

<body>

<div class="container">

<h1>🎬 My AI Video Maker</h1>
<p style="text-align:center">
Create Videos From Your Photos
</p>

<div class="box">

<h3>📸 Upload Your Photo</h3>

<input type="file" id="photo" accept="image/*">

<img id="preview" alt="Photo Preview">

<h3>✍️ Describe Your Video</h3>

<textarea id="prompt"
placeholder="Describe how you want your photo to move..."></textarea>

<button type="button" onclick="generateVideo()">
Generate Video 🚀
</button>

<p id="message">Upload your photo to get started.</p>

</div>
</div>

<script>

const photoInput = document.getElementById("photo");
const preview = document.getElementById("preview");
const message = document.getElementById("message");

photoInput.addEventListener("change", function() {

  const file = photoInput.files[0];

  if (!file) return;

  if (!file.type.startsWith("image/")) {
    message.textContent = "Please select a valid image.";
    return;
  }

  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";

  message.textContent = "Photo uploaded successfully!";

});

function generateVideo() {

  const file = photoInput.files[0];
  const prompt = document.getElementById("prompt").value.trim();

  if (!file) {
    message.textContent = "Please upload a photo first!";
    return;
  }

  if (!prompt) {
    message.textContent = "Please write your video prompt!";
    return;
  }

  message.textContent =
    "Success! Your photo and prompt are ready. AI video engine is not connected yet.";

}

</script>

</body>
</html>
